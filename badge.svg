<svg xmlns="http://www.w3.org/2000/svg" width="88" height="31" viewBox="0 0 88 31">
  <defs>
    <style>
      .bg {
        fill: #09090b;
        stroke: #27272a;
        stroke-width: 1;
      }
      .glow-border {
        fill: none;
        stroke: #22c55e;
        stroke-width: 1;
        opacity: 0.8;
        animation: borderGlow 3s ease-in-out infinite alternate;
      }
      .glow-text {
        font-family: ui-monospace, SFMono-Regular, SF Pro Mono, Menlo, Monaco, Consolas, monospace;
        font-weight: 700;
        fill: #22c55e;
        letter-spacing: 0.05em;
        text-shadow: 0 0 2px #22c55e;
      }
      .sub-text {
        font-family: ui-monospace, SFMono-Regular, SF Pro Mono, Menlo, Monaco, Consolas, monospace;
        font-size: 6px;
        fill: #a1a1aa;
        letter-spacing: 0.1em;
        opacity: 0.8;
      }
      .pixel-line {
        stroke: #18181b;
        stroke-width: 1;
        stroke-dasharray: 2 2;
      }
      .corner-tick {
        stroke: #22c55e;
        stroke-width: 1;
        fill: none;
        opacity: 0.9;
      }

      /* Animaciones de cambio de texto (Loop de 7 segundos en total: 3s slide 1, 2s slide 2, 2s slide 3) */
      .slide-1 {
        font-size: 9px;
        animation: slide1Anim 7s infinite;
      }
      .slide-2 {
        font-size: 8px;
        animation: slide2Anim 7s infinite;
      }
      .slide-3 {
        font-size: 8px;
        animation: slide3Anim 7s infinite;
      }

      /* Slide 1 (nikitastrike) activa de 0% a 42.8% (3 segundos) */
      @keyframes slide1Anim {
        0%, 42.8% { opacity: 1; transform: translateY(0); }
        42.9%, 100% { opacity: 0; transform: translateY(-5px); }
      }

      /* Slide 2 (CYBERSEC) activa de 42.9% a 71.4% (2 segundos) */
      @keyframes slide2Anim {
        0%, 42.8% { opacity: 0; transform: translateY(5px); }
        42.9%, 71.4% { opacity: 1; transform: translateY(0); }
        71.5%, 100% { opacity: 0; transform: translateY(-5px); }
      }

      /* Slide 3 (DEVOPS) activa de 71.5% a 100% (2 segundos) */
      @keyframes slide3Anim {
        0%, 71.4% { opacity: 0; transform: translateY(5px); }
        71.5%, 100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes borderGlow {
        0% {
          opacity: 0.4;
          stroke: #15803d;
        }
        100% {
          opacity: 1;
          stroke: #22c55e;
        }
      }
    </style>
  </defs>
  
  <!-- Outer border -->
  <rect width="88" height="31" rx="2" class="bg" />
  
  <!-- Grid dotted background sutil -->
  <line x1="1" y1="6" x2="87" y2="6" class="pixel-line" />
  <line x1="1" y1="12" x2="87" y2="12" class="pixel-line" />
  <line x1="1" y1="18" x2="87" y2="18" class="pixel-line" />
  <line x1="1" y1="24" x2="87" y2="24" class="pixel-line" />
  
  <!-- Glow Inner Border -->
  <rect x="2" y="2" width="84" height="27" rx="1" class="glow-border" />

  <!-- Viñetas en las esquinas (Corner brackets/ticks) -->
  <!-- Top Left -->
  <path d="M 4 8 L 4 4 L 8 4" class="corner-tick" />
  <!-- Top Right -->
  <path d="M 80 4 L 84 4 L 84 8" class="corner-tick" />
  <!-- Bottom Left -->
  <path d="M 4 23 L 4 27 L 8 27" class="corner-tick" />
  <!-- Bottom Right -->
  <path d="M 80 27 L 84 27 L 84 23" class="corner-tick" />
  
  <!-- Textos rotativos animados (centrados) -->
  <!-- Slide 1 (nikitastrike) -->
  <g class="glow-text slide-1">
    <text x="44" y="12" text-anchor="middle" dominant-baseline="central">nikitastrike</text>
    <text x="44" y="22" text-anchor="middle" dominant-baseline="central" class="sub-text">PORTFOLIO</text>
  </g>

  <!-- Slide 2 (CYBERSEC) -->
  <g class="glow-text slide-2">
    <text x="44" y="12" text-anchor="middle" dominant-baseline="central">CYBERSEC</text>
    <text x="44" y="22" text-anchor="middle" dominant-baseline="central" class="sub-text">INFRASTRUCTURE</text>
  </g>

  <!-- Slide 3 (DEVOPS) -->
  <g class="glow-text slide-3">
    <text x="44" y="12" text-anchor="middle" dominant-baseline="central">DEVOPS</text>
    <text x="44" y="22" text-anchor="middle" dominant-baseline="central" class="sub-text">AUTOMATION</text>
  </g>
</svg>
